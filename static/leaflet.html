<!doctype html>
<meta name="viewport" content="width=device-width,maximum-scale=1">
<title>leaflet tilesample</title>
<style>#map{height:100vh;:has(&){display:contents}}</style>

<link crossorigin rel="stylesheet" href="https://unpkg.com/leaflet@2.0.0-alpha.1/dist/leaflet.css" integrity="sha384-mduptj5Hiyp/jSH2p+p4A8UdSz0gnkrO1y37pdMuUTkAMEUuDsr12k7o4eQJXufp">
<link crossorigin rel="modulepreload" href="https://unpkg.com/leaflet@2.0.0-alpha.1/dist/leaflet-src.js" integrity="sha384-DsgbU5kfRsjOKbADtxYpLK8Zx8jn6L76BM5SdLczDx0aUAMeaBTYoKjnfS5n7LtJ">

<div id="map"></div>

<script type="module">
  import L from "https://unpkg.com/leaflet@2.0.0-alpha.1/dist/leaflet-src.js";
  const map = window.map = new L.LeafletMap('map').setView([0, 0], 1);

  new L.TileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 22,
      maxNativeZoom: 19,
  }).addTo(map);
  new L.Control.Scale().addTo(map);

  const tilejson = await fetch("./").then(r => r.json());
  new L.TileLayer(tilejson.tiles[0], {
    maxZoom: 22,
    maxNativeZoom: tilejson.maxzoom,
  }).addTo(map);
  map.getContainer().focus();
</script>
